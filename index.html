<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thợ Săn Quái Thú Emoji</title>
  <style>
    * { touch-action: manipulation; box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #0d1117; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
      max-width: 480px; max-height: 850px;
      display: flex; justify-content: center; align-items: center;
    }
    canvas {
      width: 100%; height: 100%;
      object-fit: contain;
      background-color: #0b0e14;
      touch-action: none;
    }
    .fullscreen-btn {
      position: absolute; top: 10px; right: 10px; z-index: 100;
      background: rgba(0, 0, 0, 0.7); border: 1.5px solid #50fa7b;
      color: #50fa7b; padding: 6px 12px; border-radius: 20px;
      font-size: 12px; font-weight: bold; cursor: pointer;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
    <canvas id="gameCanvas" width="360" height="640"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function toggleFullscreen() {
      const container = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // Tải ảnh nền khu rừng bg.jpg
    const bgImg = new Image();
    bgImg.src = 'bg.jpg';

    // Danh sách Emoji quái thú
    const MONSTER_EMOJIS = ['🐯','🦁','🦍','🦏','🫎','🫏','🐖','🐱','🐺','🐮','🐗','🐴','🦎','🦕','🐢','🐊','🐍','🦖','🐂','🐃','🦬','🐏','🐑','🐐','🦌','🦙','🦥','🦘','ZEBRA','🐘','🦣','🦛','🦒','🐆','🐅','🐒','🦧','🐪','🦔','🦨','🦅','🦉','🦜','🐦','🕊️','🪿','🦈'];

    let stage = 1;
    let score = 0;
    let hp = 3;
    let maxHp = 5;
    let gameOver = false;
    let restartTimer = 0;
    let stageTextTimer = 100;
    let weaponLevel = 1;

    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 80,
      size: 40,
      emoji: '🗼'
    };

    let bullets = [];
    let monsters = [];
    let poops = [];
    let items = [];
    let boss = null;

    function getRandomMonster() {
      return MONSTER_EMOJIS[Math.floor(Math.random() * MONSTER_EMOJIS.length)];
    }

    function startStage(stageNum) {
      stage = stageNum;
      stageTextTimer = 90;
      poops = [];
      bullets = [];
      items = [];

      monsters = [];
      const rows = 3;
      const cols = 6;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          monsters.push({
            x: 20 + c * 52,
            y: 70 + r * 50,
            size: 34,
            alive: true,
            emoji: getRandomMonster()
          });
        }
      }

      boss = {
        x: canvas.width / 2 - 35,
        y: 20,
        size: 70,
        speed: 2 + stage * 0.2,
        dir: 1,
        hp: 20 + stage * 5,
        maxHp: 20 + stage * 5,
        alive: true,
        emoji: getRandomMonster()
      };
    }

    function resetGame() {
      score = 0;
      hp = 3;
      weaponLevel = 1;
      player.x = canvas.width / 2 - 20;
      gameOver = false;
      restartTimer = 0;
      startStage(1);
    }

    resetGame();

    function handleInput(clientX) {
      if (gameOver) {
        resetGame();
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      const touchX = (clientX - rect.left) * scale;
      player.x = Math.max(0, Math.min(canvas.width - player.size, touchX - player.size / 2));
    }

    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleInput(e.touches[0].clientX); });
    canvas.addEventListener('touchstart', (e) => { handleInput(e.touches[0].clientX); });
    canvas.addEventListener('click', (e) => { if (gameOver) resetGame(); });

    // Bắn đạn đá (🪨)
    setInterval(() => {
      if (!gameOver) {
        const cx = player.x + player.size / 2 - 10;
        if (weaponLevel === 1) {
          bullets.push({ x: cx, y: player.y, vx: 0, vy: -10, size: 20 });
        } else if (weaponLevel === 2) {
          bullets.push({ x: cx - 12, y: player.y, vx: 0, vy: -10, size: 20 });
          bullets.push({ x: cx + 12, y: player.y, vx: 0, vy: -10, size: 20 });
        } else {
          bullets.push({ x: cx, y: player.y, vx: 0, vy: -10, size: 20 });
          bullets.push({ x: cx - 16, y: player.y, vx: -1.5, vy: -9.5, size: 20 });
          bullets.push({ x: cx + 16, y: player.y, vx: 1.5, vy: -9.5, size: 20 });
        }
      }
    }, 200);

    // Quái thả cức (💩)
    setInterval(() => {
      if (!gameOver) {
        if (boss && boss.alive) {
          poops.push({ x: boss.x + boss.size / 2 - 12, y: boss.y + boss.size, speed: 4 + stage * 0.3, size: 24 });
        }
        const aliveMonsters = monsters.filter(m => m.alive);
        if (aliveMonsters.length > 0) {
          const m = aliveMonsters[Math.floor(Math.random() * aliveMonsters.length)];
          poops.push({ x: m.x + m.size / 2 - 10, y: m.y + m.size, speed: 3.2 + stage * 0.3, size: 20 });
        }
      }
    }, 750);

    function update() {
      if (gameOver) {
        restartTimer++;
        if (restartTimer >= 180) resetGame();
        return;
      }

      if (stageTextTimer > 0) stageTextTimer--;

      if (boss && boss.alive) {
        boss.x += boss.speed * boss.dir;
        if (boss.x <= 10 || boss.x + boss.size >= canvas.width - 10) boss.dir *= -1;
      }

      bullets.forEach((b, index) => {
        b.x += b.vx || 0;
        b.y += b.vy || -10;
        if (b.y < -30 || b.x < 0 || b.x > canvas.width) bullets.splice(index, 1);
      });

      poops.forEach((p, index) => {
        p.y += p.speed;
        if (p.x < player.x + player.size && p.x + p.size > player.x &&
            p.y < player.y + player.size && p.y + p.size > player.y) {
          poops.splice(index, 1);
          hp -= 1;
          if (hp <= 0) { gameOver = true; restartTimer = 0; }
        }
        if (p.y > canvas.height) poops.splice(index, 1);
      });

      items.forEach((it, index) => {
        it.y += 2.2;
        if (it.x < player.x + player.size && it.x + it.size > player.x &&
            it.y < player.y + player.size && it.y + it.size > player.y) {
          items.splice(index, 1);
          if (it.type === 'gift') {
            if (weaponLevel < 3) weaponLevel++;
            score += 50;
          } else if (it.type === 'heart') {
            if (hp < maxHp) hp++;
            score += 30;
          }
        }
        if (it.y > canvas.height) items.splice(index, 1);
      });

      bullets.forEach((b, bIdx) => {
        if (boss && boss.alive && b.x < boss.x + boss.size && b.x + b.size > boss.x && b.y < boss.y + boss.size && b.y + b.size > boss.y) {
          boss.hp -= 1;
          bullets.splice(bIdx, 1);
          score += 20;
          if (boss.hp <= 0) {
            boss.alive = false;
            score += 250;
            items.push({ x: boss.x + boss.size / 2 - 12, y: boss.y, type: 'gift', emoji: '🎁', size: 24 });
          }
          return;
        }

        monsters.forEach((m) => {
          if (m.alive && b.x < m.x + m.size && b.x + b.size > m.x && b.y < m.y + m.size && b.y + m.size > m.y) {
            m.alive = false;
            bullets.splice(bIdx, 1);
            score += 15;
            
            const rand = Math.random();
            if (rand < 0.20) {
              items.push({ x: m.x, y: m.y, type: 'gift', emoji: '🎁', size: 22 });
            } else if (rand < 0.35) {
              items.push({ x: m.x, y: m.y, type: 'heart', emoji: '❤️', size: 22 });
            }
          }
        });
      });

      if (monsters.every(m => !m.alive) && (!boss || !boss.alive)) {
        startStage(stage + 1);
      }
    }

    function draw() {
      // 1. Vẽ Ảnh Nền Khu Rừng
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)'; // Phủ tối mờ nhẹ để Emoji nổi bật hơn
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff5555';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.fillText('Điểm: ' + score + ' | Màn đạt: ' + stage, canvas.width / 2, canvas.height / 2 + 15);

        const cd = Math.ceil((180 - restartTimer) / 60);
        ctx.fillStyle = '#50fa7b';
        ctx.fillText('Tự động chơi lại sau: ' + cd + 's', canvas.width / 2, canvas.height / 2 + 50);
        ctx.fillStyle = '#ffb86c';
        ctx.font = '13px Arial';
        ctx.fillText('👉 CHẠM MÀN HÌNH ĐỂ THỬ LẠI 👈', canvas.width / 2, canvas.height / 2 + 85);
        return;
      }

      // 2. Vẽ Phi thuyền 🗼
      ctx.font = `${player.size}px Arial`;
      ctx.fillText(player.emoji, player.x, player.y + player.size);

      // 3. Vẽ Boss khổng lồ
      if (boss && boss.alive) {
        ctx.font = `${boss.size}px Arial`;
        ctx.fillText(boss.emoji, boss.x, boss.y + boss.size);

        ctx.fillStyle = '#ff5555';
        ctx.fillRect(boss.x, boss.y - 12, boss.size, 6);
        ctx.fillStyle = '#50fa7b';
        ctx.fillRect(boss.x, boss.y - 12, (boss.hp / boss.maxHp) * boss.size, 6);
      }

      // 4. Vẽ Quái thường
      monsters.forEach(m => {
        if (m.alive) {
          ctx.font = `${m.size}px Arial`;
          ctx.fillText(m.emoji, m.x, m.y + m.size);
        }
      });

      // 5. Vẽ Đạn đá 🪨
      bullets.forEach(b => {
        ctx.font = `${b.size}px Arial`;
        ctx.fillText('🪨', b.x, b.y + b.size);
      });

      // 6. Vẽ cức 💩
      poops.forEach(p => {
        ctx.font = `${p.size}px Arial`;
        ctx.fillText('💩', p.x, p.y + p.size);
      });

      // 7. Vẽ Quà 🎁 & Tim ❤️
      items.forEach(it => {
        ctx.font = `${it.size}px Arial`;
        ctx.fillText(it.emoji, it.x, it.y + it.size);
      });

      // Giao diện UI
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Điểm: ' + score, 10, 25);
      ctx.fillText('Màn: ' + stage, 110, 25);
      ctx.fillText('Đạn: Lvl ' + weaponLevel, 180, 25);
      ctx.fillText('Máu: ' + '❤️'.repeat(hp), 260, 25);

      if (stageTextTimer > 0) {
        ctx.fillStyle = '#50fa7b';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('MÀN ' + stage, canvas.width / 2, canvas.height / 2 - 10);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
  </html>
