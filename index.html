<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thợ Săn Quái Thú Emoji</title>
  
  <!-- Cấu hình PWA để cài thành App trên điện thoại -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Săn Quái Emoji">

  <style>
    * { touch-action: manipulation; box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
      max-width: 480px; max-height: 850px;
      display: flex; justify-content: center; align-items: center;
    }
    canvas {
      width: 100%; height: 100%;
      object-fit: contain;
      touch-action: none;
    }
    .fullscreen-btn {
      position: absolute; top: 12px; right: 12px; z-index: 100;
      background: rgba(0, 0, 0, 0.6); border: 1.5px solid #50fa7b;
      color: #50fa7b; padding: 6px 14px; border-radius: 20px;
      font-size: 13px; font-weight: bold; cursor: pointer;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
    <canvas id="gameCanvas" width="720" height="1280"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function toggleFullscreen() {
      const container = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // Tải ảnh nền bg.jpg
    const bgImg = new Image();
    bgImg.src = 'bg.jpg?v=' + Date.now();

    // Danh sách Quái thú
    const MONSTER_EMOJIS = ['🐯','🦁','🦍','🦏','🫎','🫏','🐖','🐱','🐺','🐮','🐗','🐴','🦎','🦕','🐢','🐊','🐍','🦖','🐂','🐃','🦬','🐏','🐑','🐐','🦌','🦙','🦥','🦘','ZEBRA','🐘','🦣','🦛','🦒','🐆','🐅','🐒','🦧','🐪','🦔','🦨','🦅','🦉','🦜','🐦','🕊️','🪿','🦈'];

    let stage = 1;
    let score = 0;
    // Lấy thành tích cao nhất đã lưu
    let highScore = parseInt(localStorage.getItem('emoji_hunter_highscore')) || 0;
    let hp = 3;
    let maxHp = 5;
    let gameOver = false;
    let restartTimer = 0;
    let stageTextTimer = 100;
    let weaponLevel = 1;

    const player = {
      x: canvas.width / 2 - 45,
      y: canvas.height - 200,
      size: 90,
      emoji: '🚀'
    };

    let bullets = [];
    let monsters = [];
    let poops = [];
    let items = [];
    let boss = null;

    function getRandomMonster() {
      return MONSTER_EMOJIS[Math.floor(Math.random() * MONSTER_EMOJIS.length)];
    }

    function startStage(stageNum) {
      stage = stageNum;
      stageTextTimer = 90;
      poops = [];
      bullets = [];
      items = [];

      monsters = [];
      const rows = 3;
      const cols = 6;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          monsters.push({
            x: 40 + c * 104,
            y: 140 + r * 100,
            size: 68,
            alive: true,
            emoji: getRandomMonster()
          });
        }
      }

      boss = {
        x: canvas.width / 2 - 75,
        y: 40,
        size: 150,
        speed: 4 + stage * 0.4,
        dir: 1,
        hp: 20 + stage * 5,
        maxHp: 20 + stage * 5,
        alive: true,
        emoji: getRandomMonster()
      };
    }

    function resetGame() {
      score = 0;
      hp = 3;
      weaponLevel = 1;
      player.x = canvas.width / 2 - 45;
      player.y = canvas.height - 200;
      gameOver = false;
      restartTimer = 0;
      startStage(1);
    }

    resetGame();

    function handleInput(clientX, clientY) {
      if (gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const touchX = (clientX - rect.left) * scaleX;
      const touchY = (clientY - rect.top) * scaleY;

      player.x = Math.max(0, Math.min(canvas.width - player.size, touchX - player.size / 2));
      player.y = Math.max(80, Math.min(canvas.height - player.size, touchY - player.size / 2));
    }

    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) handleInput(e.clientX, e.clientY); });
    canvas.addEventListener('click', (e) => { if (gameOver) resetGame(); });

    setInterval(() => {
      if (!gameOver) {
        const cx = player.x + player.size / 2 - 20;
        if (weaponLevel === 1) {
          bullets.push({ x: cx, y: player.y, vx: 0, vy: -20, size: 40 });
        } else if (weaponLevel === 2) {
          bullets.push({ x: cx - 24, y: player.y, vx: 0, vy: -20, size: 40 });
          bullets.push({ x: cx + 24, y: player.y, vx: 0, vy: -20, size: 40 });
        } else {
          bullets.push({ x: cx, y: player.y, vx: 0, vy: -20, size: 40 });
          bullets.push({ x: cx - 32, y: player.y, vx: -3, vy: -19, size: 40 });
          bullets.push({ x: cx + 32, y: player.y, vx: 3, vy: -19, size: 40 });
        }
      }
    }, 200);

    setInterval(() => {
      if (!gameOver) {
        if (boss && boss.alive) {
          poops.push({ x: boss.x + boss.size / 2 - 24, y: boss.y + boss.size, speed: 8 + stage * 0.6, size: 48 });
        }
        const aliveMonsters = monsters.filter(m => m.alive);
        if (aliveMonsters.length > 0) {
          const m = aliveMonsters[Math.floor(Math.random() * aliveMonsters.length)];
          poops.push({ x: m.x + m.size / 2 - 20, y: m.y + m.size, speed: 6.4 + stage * 0.6, size: 40 });
        }
      }
    }, 750);

    function update() {
      if (gameOver) {
        restartTimer++;
        if (restartTimer >= 180) resetGame();
        return;
      }

      if (stageTextTimer > 0) stageTextTimer--;

      if (boss && boss.alive) {
        boss.x += boss.speed * boss.dir;
        if (boss.x <= 20 || boss.x + boss.size >= canvas.width - 20) boss.dir *= -1;
      }

      bullets.forEach((b, index) => {
        b.x += b.vx || 0;
        b.y += b.vy || -20;
        if (b.y < -60 || b.x < 0 || b.x > canvas.width) bullets.splice(index, 1);
      });

      poops.forEach((p, index) => {
        p.y += p.speed;
        if (p.x < player.x + player.size && p.x + p.size > player.x &&
            p.y < player.y + player.size && p.y + p.size > player.y) {
          poops.splice(index, 1);
          hp -= 1;
          if (hp <= 0) {
            gameOver = true;
            restartTimer = 0;
            // Kiểm tra và lưu kỷ lục mới
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('emoji_hunter_highscore', highScore);
            }
          }
        }
        if (p.y > canvas.height) poops.splice(index, 1);
      });

      items.forEach((it, index) => {
        it.y += 4.4;
        if (it.x < player.x + player.size && it.x + it.size > player.x &&
            it.y < player.y + player.size && it.y + it.size > player.y) {
          items.splice(index, 1);
          if (it.type === 'gift') {
            if (weaponLevel < 3) weaponLevel++;
            score += 50;
          } else if (it.type === 'heart') {
            if (hp < maxHp) hp++;
            score += 30;
          }
        }
        if (it.y > canvas.height) items.splice(index, 1);
      });

      bullets.forEach((b, bIdx) => {
        if (boss && boss.alive && b.x < boss.x + boss.size && b.x + b.size > boss.x && b.y < boss.y + boss.size && b.y + b.size > boss.y) {
          boss.hp -= 1;
          bullets.splice(bIdx, 1);
          score += 20;
          if (boss.hp <= 0) {
            boss.alive = false;
            score += 250;
            items.push({ x: boss.x + boss.size / 2 - 24, y: boss.y, type: 'gift', emoji: '🎁', size: 48 });
          }
          return;
        }

        monsters.forEach((m) => {
          if (m.alive && b.x < m.x + m.size && b.x + b.size > m.x && b.y < m.y + m.size && b.y + m.size > m.y) {
            m.alive = false;
            bullets.splice(bIdx, 1);
            score += 15;
            
            const rand = Math.random();
            if (rand < 0.20) {
              items.push({ x: m.x, y: m.y, type: 'gift', emoji: '🎁', size: 44 });
            } else if (rand < 0.35) {
              items.push({ x: m.x, y: m.y, type: 'heart', emoji: '❤️', size: 44 });
            }
          }
        });
      });

      if (monsters.every(m => !m.alive) && (!boss || !boss.alive)) {
        startStage(stage + 1);
      }
    }

    function draw() {
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff5555';
        ctx.font = 'bold 56px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2 - 60);

        ctx.fillStyle = '#fff';
        ctx.font = '30px Arial';
        ctx.fillText('Điểm: ' + score + ' | Màn đạt: ' + stage, canvas.width / 2, canvas.height / 2 + 0);

        ctx.fillStyle = '#f1fa8c';
        ctx.font = 'bold 32px Arial';
        ctx.fillText('🏆 KỶ LỤC: ' + highScore, canvas.width / 2, canvas.height / 2 + 50);

        const cd = Math.ceil((180 - restartTimer) / 60);
        ctx.fillStyle = '#50fa7b';
        ctx.font = '26px Arial';
        ctx.fillText('Tự động chơi lại sau: ' + cd + 's', canvas.width / 2, canvas.height / 2 + 110);
        ctx.fillStyle = '#ffb86c';
        ctx.font = '24px Arial';
        ctx.fillText('👉 CHẠM MÀN HÌNH ĐỂ THỬ LẠI 👈', canvas.width / 2, canvas.height / 2 + 160);
        return;
      }

      // Phi thuyền 🚀
      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
      ctx.shadowBlur = 12;
      ctx.font = `bold ${player.size}px Arial`;
      ctx.fillText(player.emoji, player.x, player.y + player.size);
      ctx.restore();

      // Boss
      if (boss && boss.alive) {
        ctx.save();
        ctx.shadowColor = 'rgba(255, 200, 0, 0.8)';
        ctx.shadowBlur = 15;
        ctx.font = `bold ${boss.size}px Arial`;
        ctx.fillText(boss.emoji, boss.x, boss.y + boss.size);
        ctx.restore();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(boss.x - 5, boss.y - 30, boss.size + 10, 16);
        ctx.fillStyle = '#ff5555';
        ctx.fillRect(boss.x, boss.y - 26, boss.size, 8);
        ctx.fillStyle = '#50fa7b';
        ctx.fillRect(boss.x, boss.y - 26, (boss.hp / boss.maxHp) * boss.size, 8);
      }

      // Quái thường
      monsters.forEach(m => {
        if (m.alive) {
          ctx.font = `${m.size}px Arial`;
          ctx.fillText(m.emoji, m.x, m.y + m.size);
        }
      });

      // Đạn
      bullets.forEach(b => {
        ctx.font = `${b.size}px Arial`;
        ctx.fillText('🪨', b.x, b.y + b.size);
      });

      // Vật cản
      poops.forEach(p => {
        ctx.font = `${p.size}px Arial`;
        ctx.fillText('💩', p.x, p.y + p.size);
      });

      // Vật phẩm
      items.forEach(it => {
        ctx.font = `${it.size}px Arial`;
        ctx.fillText(it.emoji, it.x, it.y + it.size);
      });

      // Giao diện UI có Kỷ lục
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Điểm: ' + score, 20, 45);
      ctx.fillText('Màn: ' + stage, 180, 45);
      ctx.fillText('🏆 ' + highScore, 310, 45);
      ctx.fillText('Máu: ' + '❤️'.repeat(hp), 520, 45);

      if (stageTextTimer > 0) {
        ctx.fillStyle = '#50fa7b';
        ctx.font = 'bold 56px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('MÀN ' + stage, canvas.width / 2, canvas.height / 2 - 20);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // Đăng ký Service Worker để cho phép chơi Offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed:', err));
      });
    }
  </script>
</body>
  </html>
