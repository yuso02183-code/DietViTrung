<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Diệt Vi Trùng - Full Sprite Edition</title>
  <style>
    * { touch-action: manipulation; box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #000; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 850px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #05050a;
      touch-action: none;
    }
    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid #50fa7b;
      color: #50fa7b;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
    <canvas id="gameCanvas" width="360" height="640"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function toggleFullscreen() {
      const container = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // 1. TẢI CÁC HÌNH ẢNH
    const bgImg = new Image();
    bgImg.src = 'bg.jpg';

    const shipSheet = new Image();
    shipSheet.src = 'ships.png';

    const rawGiftSheet = new Image();
    rawGiftSheet.src = 'gifts.png';

    const rawGermSheet = new Image();
    rawGermSheet.src = 'germs.png';
    rawGermSheet.onerror = () => {
      rawGermSheet.src = 'virus-1-4-1743496069202-1743496070057274.png';
    };

    // Canvas lọc nền cho Hộp Quà (Xóa nền hồng nhạt)
    let processedGiftCanvas = null;
    rawGiftSheet.onload = () => {
      processedGiftCanvas = document.createElement('canvas');
      processedGiftCanvas.width = rawGiftSheet.width;
      processedGiftCanvas.height = rawGiftSheet.height;
      const pCtx = processedGiftCanvas.getContext('2d');
      pCtx.drawImage(rawGiftSheet, 0, 0);

      const imgData = pCtx.getImageData(0, 0, rawGiftSheet.width, rawGiftSheet.height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        // Lọc màu hồng nhạt của nền hộp quà (R > 230, G > 220, B > 220)
        if (data[i] > 230 && data[i+1] > 220 && data[i+2] > 220) {
          data[i+3] = 0; // Làm trong suốt
        }
      }
      pCtx.putImageData(imgData, 0, 0);
    };

    // Canvas lọc nền cho Vi Trùng (Xóa nền trắng)
    let processedGermCanvas = null;
    rawGermSheet.onload = () => {
      processedGermCanvas = document.createElement('canvas');
      processedGermCanvas.width = rawGermSheet.width;
      processedGermCanvas.height = rawGermSheet.height;
      const pCtx = processedGermCanvas.getContext('2d');
      pCtx.drawImage(rawGermSheet, 0, 0);

      const imgData = pCtx.getImageData(0, 0, rawGermSheet.width, rawGermSheet.height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] > 225 && data[i+1] > 225 && data[i+2] > 225) {
          data[i+3] = 0;
        }
      }
      pCtx.putImageData(imgData, 0, 0);
    };

    let stage = 1;
    let score = 0;
    let hp = 3;
    let gameOver = false;
    let restartTimer = 0;
    let stageTextTimer = 100;
    let weaponLevel = 1;
    let currentShipIndex = 0;

    const player = {
      x: canvas.width / 2 - 22,
      y: canvas.height - 80,
      width: 44,
      height: 50
    };

    let bullets = [];
    let germs = [];
    let poisons = [];
    let gifts = [];
    let boss = null;

    function selectRandomShip() {
      currentShipIndex = Math.floor(Math.random() * 12);
    }

    function startStage(stageNum) {
      stage = stageNum;
      stageTextTimer = 90;
      poisons = [];
      bullets = [];
      gifts = [];
      selectRandomShip();

      germs = [];
      const rows = Math.min(5, 3 + Math.floor(stage / 2));
      const cols = 6;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          germs.push({
            x: 18 + c * 55,
            y: 70 + r * 44,
            width: 36,
            height: 36,
            type: Math.floor(Math.random() * 18),
            alive: true
          });
        }
      }

      boss = {
        x: canvas.width / 2 - 35,
        y: 30,
        width: 70,
        height: 45,
        speed: 2 + stage * 0.2,
        dir: 1,
        hp: 15 + stage * 6,
        maxHp: 15 + stage * 6,
        alive: true
      };
    }

    function resetGame() {
      score = 0;
      hp = 3;
      weaponLevel = 1;
      player.x = canvas.width / 2 - 22;
      gameOver = false;
      restartTimer = 0;
      startStage(1);
    }

    resetGame();

    function handleInput(clientX) {
      if (gameOver) {
        resetGame();
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      const touchX = (clientX - rect.left) * scale;
      player.x = Math.max(0, Math.min(canvas.width - player.width, touchX - player.width / 2));
    }

    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleInput(e.touches[0].clientX); });
    canvas.addEventListener('touchstart', (e) => { handleInput(e.touches[0].clientX); });
    canvas.addEventListener('click', (e) => { if (gameOver) resetGame(); });

    setInterval(() => {
      if (!gameOver) {
        const cx = player.x + player.width / 2;
        if (weaponLevel === 1) {
          bullets.push({ x: cx - 5, y: player.y, vx: 0, vy: -9.5 });
        } else if (weaponLevel === 2) {
          bullets.push({ x: cx - 15, y: player.y, vx: 0, vy: -9.5 });
          bullets.push({ x: cx + 5, y: player.y, vx: 0, vy: -9.5 });
        } else if (weaponLevel === 3) {
          bullets.push({ x: cx - 5, y: player.y, vx: 0, vy: -9.5 });
          bullets.push({ x: cx - 18, y: player.y, vx: -2, vy: -9 });
          bullets.push({ x: cx + 8, y: player.y, vx: 2, vy: -9 });
        } else {
          bullets.push({ x: cx - 5, y: player.y, vx: 0, vy: -10 });
          bullets.push({ x: cx - 14, y: player.y, vx: -1.5, vy: -9.5 });
          bullets.push({ x: cx + 4, y: player.y, vx: 1.5, vy: -9.5 });
          bullets.push({ x: cx - 22, y: player.y, vx: -3, vy: -8.5 });
          bullets.push({ x: cx + 12, y: player.y, vx: 3, vy: -8.5 });
        }
      }
    }, 190);

    setInterval(() => {
      if (!gameOver) {
        if (boss && boss.alive) {
          poisons.push({ x: boss.x + boss.width / 2 - 4, y: boss.y + boss.height, speed: 4 + stage * 0.3 });
        }
        const aliveGerms = germs.filter(g => g.alive);
        if (aliveGerms.length > 0) {
          const g = aliveGerms[Math.floor(Math.random() * aliveGerms.length)];
          poisons.push({ x: g.x + g.width / 2 - 4, y: g.y + g.height, speed: 3.2 + stage * 0.3 });
        }
      }
    }, 800);

    function update() {
      if (gameOver) {
        restartTimer++;
        if (restartTimer >= 180) resetGame();
        return;
      }

      if (stageTextTimer > 0) stageTextTimer--;

      if (boss && boss.alive) {
        boss.x += boss.speed * boss.dir;
        if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) boss.dir *= -1;
      }

      bullets.forEach((b, index) => {
        b.x += b.vx || 0;
        b.y += b.vy || -9.5;
        if (b.y < -20 || b.x < 0 || b.x > canvas.width) bullets.splice(index, 1);
      });

      poisons.forEach((p, index) => {
        p.y += p.speed;
        if (p.x < player.x + player.width && p.x + 8 > player.x &&
            p.y < player.y + player.height && p.y + 12 > player.y) {
          poisons.splice(index, 1);
          hp -= 1;
          if (hp <= 0) { gameOver = true; restartTimer = 0; }
        }
        if (p.y > canvas.height) poisons.splice(index, 1);
      });

      gifts.forEach((g, index) => {
        g.y += 2.2;
        if (g.x < player.x + player.width && g.x + 28 > player.x &&
            g.y < player.y + player.height && g.y + 28 > player.y) {
          gifts.splice(index, 1);
          if (weaponLevel < 4) weaponLevel++;
          score += 50;
        }
        if (g.y > canvas.height) gifts.splice(index, 1);
      });

      bullets.forEach((b, bIdx) => {
        if (boss && boss.alive && b.x < boss.x + boss.width && b.x + 10 > boss.x && b.y < boss.y + boss.height && b.y + 16 > boss.y) {
          boss.hp -= 1;
          bullets.splice(bIdx, 1);
          score += 20;
          if (boss.hp <= 0) {
            boss.alive = false;
            score += 250;
            gifts.push({ x: boss.x + boss.width / 2 - 14, y: boss.y, type: Math.floor(Math.random() * 8) });
          }
          return;
        }

        germs.forEach((g) => {
          if (g.alive && b.x < g.x + g.width && b.x + 10 > g.x && b.y < g.y + g.height && b.y + 16 > g.y) {
            g.alive = false;
            bullets.splice(bIdx, 1);
            score += 15;
            if (Math.random() < 0.25) {
              gifts.push({ x: g.x + 4, y: g.y, type: Math.floor(Math.random() * 8) });
            }
          }
        });
      });

      if (germs.every(g => !g.alive) && (!boss || !boss.alive)) {
        startStage(stage + 1);
      }
    }

    function draw() {
      // 1. Ảnh Nền Vi Trùng
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(5, 5, 12, 0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#05050a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff5555';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.fillText('Điểm: ' + score + ' | Màn đạt: ' + stage, canvas.width / 2, canvas.height / 2 + 15);

        const cd = Math.ceil((180 - restartTimer) / 60);
        ctx.fillStyle = '#50fa7b';
        ctx.fillText('Tự động hồi sinh sau: ' + cd + 's', canvas.width / 2, canvas.height / 2 + 50);
        ctx.fillStyle = '#ffb86c';
        ctx.font = '13px Arial';
        ctx.fillText('👉 CHẠM MÀN HÌNH ĐỂ CHƠI LẠI NGAY 👈', canvas.width / 2, canvas.height / 2 + 85);
        return;
      }

      // 2. Cắt Tàu Vũ Trụ (Hình 2 - Cột Trái)
      if (shipSheet.complete && shipSheet.naturalWidth > 0) {
        const shipH = shipSheet.naturalHeight / 12;
        ctx.drawImage(shipSheet, 0, currentShipIndex * shipH, shipSheet.naturalWidth * 0.5, shipH, player.x, player.y, player.width, player.height);
      } else {
        ctx.fillStyle = '#0066ff';
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }

      // 3. Boss Phi Thuyền
      if (boss && boss.alive) {
        if (shipSheet.complete && shipSheet.naturalWidth > 0) {
          const shipH = shipSheet.naturalHeight / 12;
          ctx.drawImage(shipSheet, 0, 11 * shipH, shipSheet.naturalWidth * 0.5, shipH, boss.x, boss.y, boss.width, boss.height);
        } else {
          ctx.fillStyle = '#ff3366';
          ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
        }
        ctx.fillStyle = '#ff5555';
        ctx.fillRect(boss.x, boss.y - 8, boss.width, 4);
        ctx.fillStyle = '#50fa7b';
        ctx.fillRect(boss.x, boss.y - 8, (boss.hp / boss.maxHp) * boss.width, 4);
      }

      // 4. Cắt Đạn Lửa (Hình 2 - Cột Phải)
      bullets.forEach(b => {
        if (shipSheet.complete && shipSheet.naturalWidth > 0) {
          const shipH = shipSheet.naturalHeight / 12;
          ctx.drawImage(shipSheet, shipSheet.naturalWidth * 0.5, currentShipIndex * shipH, shipSheet.naturalWidth * 0.5, shipH * 0.4, b.x, b.y, 10, 20);
        } else {
          ctx.fillStyle = '#ff5555';
          ctx.fillRect(b.x, b.y, 6, 14);
        }
      });

      // 5. Đạn Độc
      ctx.fillStyle = '#50fa7b';
      poisons.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x + 4, p.y + 6, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 6. Cắt Hộp Quà (Hình 1 - 2 hàng x 4 cột đã lọc nền hồng)
      gifts.forEach(g => {
        const targetGift = processedGiftCanvas || rawGiftSheet;
        if (targetGift) {
          const gw = rawGiftSheet.width / 4;
          const gh = (rawGiftSheet.height * 0.88) / 2; // Bỏ phần watermark ở chân
          const gx = (g.type % 4) * gw;
          const gy = Math.floor(g.type / 4) * gh;
          ctx.drawImage(targetGift, gx, gy, gw, gh, g.x, g.y, 28, 28);
        } else {
          ctx.font = '20px serif';
          ctx.fillText('🎁', g.x, g.y + 20);
        }
      });

      // 7. Cắt Vi Trùng (3 hàng x 6 cột đã lọc nền trắng)
      germs.forEach(g => {
        if (g.alive) {
          const targetGerm = processedGermCanvas || rawGermSheet;
          if (targetGerm) {
            const srcW = rawGermSheet.width / 6;
            const srcH = (rawGermSheet.height * 0.88) / 3;
            const gx = (g.type % 6) * srcW;
            const gy = Math.floor(g.type / 6) * srcH;
            ctx.drawImage(targetGerm, gx, gy, srcW, srcH, g.x, g.y, g.width, g.height);
          } else {
            ctx.font = '24px serif';
            ctx.fillText('👾', g.x, g.y + g.height);
          }
        }
      });

      // 8. Bảng UI
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Điểm: ' + score, 10, 25);
      ctx.fillText('Màn: ' + stage, 125, 25);
      ctx.fillText('Đạn: Lvl ' + weaponLevel, 195, 25);
      ctx.fillText('Máu: ' + '❤️'.repeat(hp), 270, 25);

      if (stageTextTimer > 0) {
        ctx.fillStyle = '#50fa7b';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('STAGE ' + stage, canvas.width / 2, canvas.height / 2 - 10);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
