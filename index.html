<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Diệt Vi Trùng - Pixel Edition</title>
  <style>
    * { touch-action: manipulation; box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #05050a; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
      max-width: 480px; max-height: 850px;
      display: flex; justify-content: center; align-items: center;
    }
    canvas {
      width: 100%; height: 100%;
      object-fit: contain;
      background-color: #05050a;
      touch-action: none;
    }
    .fullscreen-btn {
      position: absolute; top: 10px; right: 10px; z-index: 100;
      background: rgba(0, 0, 0, 0.6); border: 1.5px solid #50fa7b;
      color: #50fa7b; padding: 6px 12px; border-radius: 20px;
      font-size: 12px; font-weight: bold; cursor: pointer;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
    <canvas id="gameCanvas" width="360" height="640"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function toggleFullscreen() {
      const container = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // Tải các tài nguyên hình ảnh cậu vừa chuẩn bị
    const bgImg = new Image();
    bgImg.src = 'virus-1-4-1743496069202-1743496070057274412836.jpg';

    const shipImg = new Image();
    shipImg.src = 'ship.png'; // Ảnh phi thuyền[span_6](start_span)[span_6](end_span)

    const bulletImg = new Image();
    bulletImg.src = 'bullet.png'; // Ảnh đạn lửa[span_7](start_span)[span_7](end_span)

    const virusSheet = new Image();
    virusSheet.src = 'spritesheet.png'; // Bảng 18 con virus (6 cột x 3 hàng)[span_8](start_span)[span_8](end_span)

    let stage = 1;
    let score = 0;
    let hp = 3;
    let gameOver = false;
    let restartTimer = 0;
    let stageTextTimer = 100;
    let weaponLevel = 1;
    let currentShipIndex = 0;

    const player = {
      x: canvas.width / 2 - 24,
      y: canvas.height - 90,
      width: 48,
      height: 48
    };

    let bullets = [];
    let germs = [];
    let poisons = [];
    let gifts = [];
    let boss = null;

    function startStage(stageNum) {
      stage = stageNum;
      stageTextTimer = 90;
      poisons = [];
      bullets = [];
      gifts = [];
      currentShipIndex = Math.floor(Math.random() * 2); // Chọn ngẫu nhiên 1 trong 2 phi thuyền[span_9](start_span)[span_9](end_span)

      germs = [];
      const rows = 3; // 3 hàng virus từ bảng ảnh[span_10](start_span)[span_10](end_span)
      const cols = 6; // 6 cột virus từ bảng ảnh[span_11](start_span)[span_11](end_span)
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          germs.push({
            col: c,
            row: r,
            x: 20 + c * 52,
            y: 70 + r * 52,
            width: 42,
            height: 42,
            alive: true
          });
        }
      }

      boss = {
        x: canvas.width / 2 - 40,
        y: 30,
        width: 80,
        height: 60,
        speed: 2 + stage * 0.2,
        dir: 1,
        hp: 20 + stage * 5,
        maxHp: 20 + stage * 5,
        alive: true
      };
    }

    function resetGame() {
      score = 0;
      hp = 3;
      weaponLevel = 1;
      player.x = canvas.width / 2 - 24;
      gameOver = false;
      restartTimer = 0;
      startStage(1);
    }

    resetGame();

    function handleInput(clientX) {
      if (gameOver) {
        resetGame();
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      const touchX = (clientX - rect.left) * scale;
      player.x = Math.max(0, Math.min(canvas.width - player.width, touchX - player.width / 2));
    }

    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleInput(e.touches[0].clientX); });
    canvas.addEventListener('touchstart', (e) => { handleInput(e.touches[0].clientX); });
    canvas.addEventListener('click', (e) => { if (gameOver) resetGame(); });

    // Bắn đạn liên tục
    setInterval(() => {
      if (!gameOver) {
        const cx = player.x + player.width / 2;
        if (weaponLevel === 1) {
          bullets.push({ x: cx - 6, y: player.y, vx: 0, vy: -10, width: 12, height: 24 });
        } else if (weaponLevel === 2) {
          bullets.push({ x: cx - 14, y: player.y, vx: 0, vy: -10, width: 12, height: 24 });
          bullets.push({ x: cx + 2, y: player.y, vx: 0, vy: -10, width: 12, height: 24 });
        } else {
          bullets.push({ x: cx - 6, y: player.y, vx: 0, vy: -10, width: 12, height: 24 });
          bullets.push({ x: cx - 20, y: player.y, vx: -1.5, vy: -9.5, width: 12, height: 24 });
          bullets.push({ x: cx + 8, y: player.y, vx: 1.5, vy: -9.5, width: 12, height: 24 });
        }
      }
    }, 180);

    // Kẻ địch thả đạn độc
    setInterval(() => {
      if (!gameOver) {
        if (boss && boss.alive) {
          poisons.push({ x: boss.x + boss.width / 2 - 4, y: boss.y + boss.height, speed: 4 + stage * 0.3 });
        }
        const aliveGerms = germs.filter(g => g.alive);
        if (aliveGerms.length > 0) {
          const g = aliveGerms[Math.floor(Math.random() * aliveGerms.length)];
          poisons.push({ x: g.x + g.width / 2 - 4, y: g.y + g.height, speed: 3.2 + stage * 0.3 });
        }
      }
    }, 800);

    function update() {
      if (gameOver) {
        restartTimer++;
        if (restartTimer >= 180) resetGame();
        return;
      }

      if (stageTextTimer > 0) stageTextTimer--;

      if (boss && boss.alive) {
        boss.x += boss.speed * boss.dir;
        if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) boss.dir *= -1;
      }

      bullets.forEach((b, index) => {
        b.x += b.vx || 0;
        b.y += b.vy || -10;
        if (b.y < -30 || b.x < 0 || b.x > canvas.width) bullets.splice(index, 1);
      });

      poisons.forEach((p, index) => {
        p.y += p.speed;
        if (p.x < player.x + player.width && p.x + 10 > player.x &&
            p.y < player.y + player.height && p.y + 14 > player.y) {
          poisons.splice(index, 1);
          hp -= 1;
          if (hp <= 0) { gameOver = true; restartTimer = 0; }
        }
        if (p.y > canvas.height) poisons.splice(index, 1);
      });

      gifts.forEach((g, index) => {
        g.y += 2.2;
        if (g.x < player.x + player.width && g.x + 28 > player.x &&
            g.y < player.y + player.height && g.y + 28 > player.y) {
          gifts.splice(index, 1);
          if (weaponLevel < 3) weaponLevel++;
          score += 50;
        }
        if (g.y > canvas.height) gifts.splice(index, 1);
      });

      bullets.forEach((b, bIdx) => {
        if (boss && boss.alive && b.x < boss.x + boss.width && b.x + b.width > boss.x && b.y < boss.y + boss.height && b.y + b.height > boss.y) {
          boss.hp -= 1;
          bullets.splice(bIdx, 1);
          score += 20;
          if (boss.hp <= 0) {
            boss.alive = false;
            score += 250;
            gifts.push({ x: boss.x + boss.width / 2 - 14, y: boss.y });
          }
          return;
        }

        germs.forEach((g) => {
          if (g.alive && b.x < g.x + g.width && b.x + b.width > g.x && b.y < g.y + g.height && b.y + b.height > g.y) {
            g.alive = false;
            bullets.splice(bIdx, 1);
            score += 15;
            if (Math.random() < 0.25) {
              gifts.push({ x: g.x + 6, y: g.y });
            }
          }
        });
      });

      if (germs.every(g => !g.alive) && (!boss || !boss.alive)) {
        startStage(stage + 1);
      }
    }

    function draw() {
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(5, 5, 12, 0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#05050a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff5555';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.fillText('Điểm: ' + score + ' | Màn đạt: ' + stage, canvas.width / 2, canvas.height / 2 + 15);

        const cd = Math.ceil((180 - restartTimer) / 60);
        ctx.fillStyle = '#50fa7b';
        ctx.fillText('Tự động hồi sinh sau: ' + cd + 's', canvas.width / 2, canvas.height / 2 + 50);
        ctx.fillStyle = '#ffb86c';
        ctx.font = '13px Arial';
        ctx.fillText('👉 CHẠM MÀN HÌNH ĐỂ CHƠI LẠI NGAY 👈', canvas.width / 2, canvas.height / 2 + 85);
        return;
      }

      // 1. Vẽ Phi Thuyền từ file ship.png (Cắt ảnh theo từng tàu)[span_12](start_span)[span_12](end_span)
      if (shipImg.complete && shipImg.naturalWidth > 0) {
        const sWidth = shipImg.naturalWidth / 2;
        const sHeight = shipImg.naturalHeight;
        ctx.drawImage(shipImg, currentShipIndex * sWidth, 0, sWidth, sHeight, player.x, player.y, player.width, player.height);
      } else {
        ctx.fillStyle = '#50fa7b';
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }

      // 2. Vẽ Boss
      if (boss && boss.alive) {
        if (virusSheet.complete && virusSheet.naturalWidth > 0) {
          ctx.drawImage(virusSheet, 0, 0, virusSheet.naturalWidth / 6, virusSheet.naturalHeight / 3, boss.x, boss.y, boss.width, boss.height);
        } else {
          ctx.fillStyle = '#ff3333';
          ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
        }

        ctx.fillStyle = '#ff5555';
        ctx.fillRect(boss.x, boss.y - 10, boss.width, 5);
        ctx.fillStyle = '#50fa7b';
        ctx.fillRect(boss.x, boss.y - 10, (boss.hp / boss.maxHp) * boss.width, 5);
      }

      // 3. Vẽ Đạn Lửa từ bullet.png[span_13](start_span)[span_13](end_span)
      if (bulletImg.complete && bulletImg.naturalWidth > 0) {
        bullets.forEach(b => {
          ctx.drawImage(bulletImg, b.x, b.y, b.width, b.height);
        });
      } else {
        ctx.fillStyle = '#ffeb3b';
        bullets.forEach(b => { ctx.fillRect(b.x, b.y, b.width, b.height); });
      }

      // 4. Vẽ Đạn Độc
      ctx.fillStyle = '#50fa7b';
      poisons.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x + 4, p.y + 6, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 5. Vẽ Hộp Quà Nâng Cấp Đạn
      gifts.forEach(g => {
        ctx.fillStyle = '#ff79c6';
        ctx.fillRect(g.x, g.y, 26, 26);
        ctx.fillStyle = '#fff';
        ctx.fillRect(g.x + 10, g.y, 6, 26);
        ctx.fillRect(g.x, g.y + 10, 26, 6);
      });

      // 6. Cắt và vẽ 18 con Virus từ file spritesheet.png[span_14](start_span)[span_14](end_span)
      if (virusSheet.complete && virusSheet.naturalWidth > 0) {
        const vCols = 6;
        const vRows = 3;
        const cellW = virusSheet.naturalWidth / vCols;
        const cellH = virusSheet.naturalHeight / vRows;

        germs.forEach(g => {
          if (g.alive) {
            ctx.drawImage(
              virusSheet,
              g.col * cellW, g.row * cellH, cellW, cellH,
              g.x, g.y, g.width, g.height
            );
          }
        });
      }

      // Giao diện UI Điểm số, Máu
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Điểm: ' + score, 10, 25);
      ctx.fillText('Màn: ' + stage, 120, 25);
      ctx.fillText('Đạn: Lvl ' + weaponLevel, 190, 25);
      ctx.fillText('Máu: ' + '❤️'.repeat(hp), 265, 25);

      if (stageTextTimer > 0) {
        ctx.fillStyle = '#50fa7b';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('STAGE ' + stage, canvas.width / 2, canvas.height / 2 - 10);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
  </html>
