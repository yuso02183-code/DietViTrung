<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Diệt Vi Trùng - Fullscreen Edition</title>
  <style>
    * { touch-action: manipulation; box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #050508; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 850px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #05050a;
      touch-action: none;
    }
    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid #50fa7b;
      color: #50fa7b;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .fullscreen-btn:active {
      background: #50fa7b;
      color: #000;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
    <canvas id="gameCanvas" width="360" height="640"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Chế độ Toàn màn hình (Fullscreen)
    function toggleFullscreen() {
      const container = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Tải ảnh nền vi trùng (Hình 7)
    const bgImage = new Image();
    bgImage.src = 'https://images.unsplash.com/photo-1584036561566-baf8f5f1b144?auto=format&fit=crop&w=600&q=80';

    let stage = 1;
    let score = 0;
    let hp = 3;
    let gameOver = false;
    let restartTimer = 0;
    let stageTextTimer = 100;
    let weaponLevel = 1;

    // 12 Mẫu Tàu Vũ Trụ Pixel (Hình 3) - Xác suất 8.33333% mỗi chiếc
    const shipSkins = [
      { name: "Đỏ Chiến Đấu", color: "#ff3333", wing: "#990000", nose: "#ffffff" },
      { name: "Bạc Siêu Tốc", color: "#e0e0e0", wing: "#888888", nose: "#00e5ff" },
      { name: "Vàng Hạng Nặng", color: "#ffcc00", wing: "#cc6600", nose: "#ff3300" },
      { name: "Xanh Lam Laser", color: "#0066ff", wing: "#002288", nose: "#00ffff" },
      { name: "Tím Đột Kích", color: "#cc00ff", wing: "#660099", nose: "#ff99ff" },
      { name: "Cam Tấn Công", color: "#ff6600", wing: "#993300", nose: "#ffff00" },
      { name: "Đồng Trinh Sát", color: "#cd7f32", wing: "#8b4513", nose: "#ffffff" },
      { name: "Vàng Siêu Cấp", color: "#e6c200", wing: "#998000", nose: "#00ffcc" },
      { name: "Cổ Điển 1", color: "#d2b48c", wing: "#8b5a2b", nose: "#ff4500" },
      { name: "Chiến Hạm Bạc", color: "#ffffff", wing: "#a9a9a9", nose: "#00ff00" },
      { name: "Hải Tặc Tím", color: "#8a2be2", wing: "#4b0082", nose: "#ff007f" },
      { name: "Siêu Tàu Xanh", color: "#00bfff", wing: "#00008b", nose: "#ffff00" }
    ];

    let currentShipIndex = 0;

    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 70,
      width: 40,
      height: 45
    };

    let bullets = [];
    let germs = [];
    let poisons = [];
    let gifts = [];
    let boss = null;

    function selectRandomShip() {
      currentShipIndex = Math.floor(Math.random() * 12);
    }

    function startStage(stageNum) {
      stage = stageNum;
      stageTextTimer = 90;
      poisons = [];
      bullets = [];
      gifts = [];
      selectRandomShip();

      // Vi Trùng Pixel (Hình 5)
      germs = [];
      const rows = Math.min(5, 3 + Math.floor(stage / 2));
      const cols = 6;
      const germTypes = ['👾', '🦠', '🦀', '👽', '🕷️'];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          germs.push({
            x: 22 + c * 54,
            y: 75 + r * 42,
            width: 32,
            height: 32,
            icon: germTypes[r % germTypes.length],
            alive: true
          });
        }
      }

      // Boss Phi Thuyền
      boss = {
        x: canvas.width / 2 - 30,
        y: 35,
        width: 60,
        height: 32,
        speed: 2 + stage * 0.2,
        dir: 1,
        hp: 12 + stage * 6,
        maxHp: 12 + stage * 6,
        alive: true
      };
    }

    function resetGame() {
      score = 0;
      hp = 3;
      weaponLevel = 1;
      player.x = canvas.width / 2 - 20;
      gameOver = false;
      restartTimer = 0;
      startStage(1);
    }

    resetGame();

    // Di chuyển Tàu cảm ứng & Chơi lại ngay
    function handleInput(clientX) {
      if (gameOver) {
        resetGame();
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      const touchX = (clientX - rect.left) * scale;
      player.x = Math.max(0, Math.min(canvas.width - player.width, touchX - player.width / 2));
    }

    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleInput(e.touches[0].clientX); });
    canvas.addEventListener('touchstart', (e) => { handleInput(e.touches[0].clientX); });
    canvas.addEventListener('click', (e) => { if (gameOver) resetGame(); });

    // Bắn đạn
    setInterval(() => {
      if (!gameOver) {
        const ship = shipSkins[currentShipIndex];
        const cx = player.x + player.width / 2;

        if (weaponLevel === 1) {
          bullets.push({ x: cx - 3, y: player.y, vx: 0, vy: -9, color: ship.color });
        } else if (weaponLevel === 2) {
          bullets.push({ x: cx - 12, y: player.y, vx: 0, vy: -9, color: ship.color });
          bullets.push({ x: cx + 6, y: player.y, vx: 0, vy: -9, color: ship.color });
        } else if (weaponLevel === 3) {
          bullets.push({ x: cx - 4, y: player.y, vx: 0, vy: -9, color: ship.color });
          bullets.push({ x: cx - 14, y: player.y, vx: -2, vy: -8.5, color: ship.color });
          bullets.push({ x: cx + 6, y: player.y, vx: 2, vy: -8.5, color: ship.color });
        } else {
          bullets.push({ x: cx - 4, y: player.y, vx: 0, vy: -9.5, color: ship.color });
          bullets.push({ x: cx - 12, y: player.y, vx: -1.5, vy: -9, color: ship.color });
          bullets.push({ x: cx + 4, y: player.y, vx: 1.5, vy: -9, color: ship.color });
          bullets.push({ x: cx - 20, y: player.y, vx: -3, vy: -8, color: ship.color });
          bullets.push({ x: cx + 12, y: player.y, vx: 3, vy: -8, color: ship.color });
        }
      }
    }, 200);

    // Kẻ địch thả độc
    setInterval(() => {
      if (!gameOver) {
        if (boss && boss.alive) {
          poisons.push({ x: boss.x + boss.width / 2 - 4, y: boss.y + boss.height, speed: 4 + stage * 0.3 });
        }
        const aliveGerms = germs.filter(g => g.alive);
        if (aliveGerms.length > 0) {
          const g = aliveGerms[Math.floor(Math.random() * aliveGerms.length)];
          poisons.push({ x: g.x + g.width / 2 - 4, y: g.y + g.height, speed: 3 + stage * 0.3 });
        }
      }
    }, 850);

    function update() {
      if (gameOver) {
        restartTimer++;
        if (restartTimer >= 180) resetGame();
        return;
      }

      if (stageTextTimer > 0) stageTextTimer--;

      if (boss && boss.alive) {
        boss.x += boss.speed * boss.dir;
        if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) boss.dir *= -1;
      }

      bullets.forEach((b, index) => {
        b.x += b.vx || 0;
        b.y += b.vy || -9;
        if (b.y < 0 || b.x < 0 || b.x > canvas.width) bullets.splice(index, 1);
      });

      poisons.forEach((p, index) => {
        p.y += p.speed;
        if (p.x < player.x + player.width && p.x + 8 > player.x &&
            p.y < player.y + player.height && p.y + 12 > player.y) {
          poisons.splice(index, 1);
          hp -= 1;
          if (hp <= 0) { gameOver = true; restartTimer = 0; }
        }
        if (p.y > canvas.height) poisons.splice(index, 1);
      });

      // Ăn Hộp Quà Pixel 🎁
      gifts.forEach((g, index) => {
        g.y += 2.5;
        if (g.x < player.x + player.width && g.x + 24 > player.x &&
            g.y < player.y + player.height && g.y + 24 > player.y) {
          gifts.splice(index, 1);
          if (weaponLevel < 4) weaponLevel++;
          score += 50;
        }
        if (g.y > canvas.height) gifts.splice(index, 1);
      });

      bullets.forEach((b, bIdx) => {
        if (boss && boss.alive && b.x < boss.x + boss.width && b.x + 8 > boss.x && b.y < boss.y + boss.height && b.y + 14 > boss.y) {
          boss.hp -= 1;
          bullets.splice(bIdx, 1);
          score += 20;
          if (boss.hp <= 0) {
            boss.alive = false;
            score += 250;
            gifts.push({ x: boss.x + boss.width / 2 - 12, y: boss.y });
          }
          return;
        }

        germs.forEach((g) => {
          if (g.alive && b.x < g.x + g.width && b.x + 8 > g.x && b.y < g.y + g.height && b.y + 14 > g.y) {
            g.alive = false;
            bullets.splice(bIdx, 1);
            score += 15;
            if (Math.random() < 0.22) gifts.push({ x: g.x + 4, y: g.y });
          }
        });
      });

      if (germs.every(g => !g.alive) && (!boss || !boss.alive)) {
        startStage(stage + 1);
      }
    }

    function drawPixelShip() {
      const ship = shipSkins[currentShipIndex];
      const x = player.x;
      const y = player.y;

      ctx.fillStyle = ship.color;
      ctx.fillRect(x + 15, y, 10, 38);
      ctx.fillRect(x + 10, y + 12, 20, 20);

      ctx.fillStyle = ship.wing;
      ctx.fillRect(x, y + 22, 10, 16);
      ctx.fillRect(x + 30, y + 22, 10, 16);

      ctx.fillStyle = ship.nose;
      ctx.fillRect(x + 17, y - 4, 6, 8);
    }

    function draw() {
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(5, 5, 12, 0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#05050a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff5555';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.fillText('Điểm: ' + score + ' | Màn đạt: ' + stage, canvas.width / 2, canvas.height / 2 + 15);

        const cd = Math.ceil((180 - restartTimer) / 60);
        ctx.fillStyle = '#50fa7b';
        ctx.fillText('Tự động hồi sinh sau: ' + cd + 's', canvas.width / 2, canvas.height / 2 + 50);
        ctx.fillStyle = '#ffb86c';
        ctx.font = '13px Arial';
        ctx.fillText('👉 CHẠM MÀN HÌNH ĐỂ CHƠI LẠI NGAY 👈', canvas.width / 2, canvas.height / 2 + 85);
        return;
      }

      drawPixelShip();

      if (boss && boss.alive) {
        ctx.fillStyle = '#ff3366';
        ctx.fillRect(boss.x, boss.y + 8, boss.width, 16);
        ctx.fillStyle = '#990033';
        ctx.fillRect(boss.x + 15, boss.y, 30, 28);
        
        ctx.fillStyle = '#ff5555';
        ctx.fillRect(boss.x, boss.y - 8, boss.width, 4);
        ctx.fillStyle = '#50fa7b';
        ctx.fillRect(boss.x, boss.y - 8, (boss.hp / boss.maxHp) * boss.width, 4);
      }

      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = b.color;
        ctx.fillRect(b.x, b.y, 6, 14);
        ctx.shadowBlur = 0;
      });

      ctx.fillStyle = '#50fa7b';
      poisons.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x + 4, p.y + 6, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.font = '20px serif';
      gifts.forEach(g => {
        ctx.fillText('🎁', g.x, g.y + 20);
      });

      ctx.font = '24px serif';
      germs.forEach(g => {
        if (g.alive) ctx.fillText(g.icon, g.x, g.y + g.height);
      });

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Điểm: ' + score, 10, 25);
      ctx.fillText('Màn: ' + stage, 125, 25);
      ctx.fillText('Đạn: Lvl ' + weaponLevel, 195, 25);
      ctx.fillText('Máu: ' + '❤️'.repeat(hp), 270, 25);

      ctx.fillStyle = '#8be9fd';
      ctx.font = '11px Arial';
      ctx.fillText('Mẫu Tàu: ' + shipSkins[currentShipIndex].name, 10, canvas.height - 12);

      if (stageTextTimer > 0) {
        ctx.fillStyle = '#50fa7b';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('STAGE ' + stage, canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#f1fa8c';
        ctx.font = '14px Arial';
        ctx.fillText('Tàu xuất hiện: ' + shipSkins[currentShipIndex].name, canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
  </html>
